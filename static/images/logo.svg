<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Coffee Cup -->
  <g transform="translate(10, 15)">
    <!-- Cup body -->
    <path d="M15 30 L15 65 Q15 75 25 75 L55 75 Q65 75 65 65 L65 30 Z"
          fill="none" stroke="#C17F4E" stroke-width="3" stroke-linecap="round"/>
    <!-- Cup handle -->
    <path d="M65 38 Q80 38 80 50 Q80 62 65 62"
          fill="none" stroke="#C17F4E" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee surface -->
    <ellipse cx="40" cy="32" rx="23" ry="5" fill="#8B5A2B"/>
    <!-- Cup rim -->
    <ellipse cx="40" cy="30" rx="25" ry="6" fill="none" stroke="#C17F4E" stroke-width="3"/>

    <!-- Steam wisps -->
    <path d="M28 8 Q24 15 28 22" fill="none" stroke="#C17F4E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 5 Q36 12 40 20" fill="none" stroke="#C17F4E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M52 8 Q56 15 52 22" fill="none" stroke="#C17F4E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Text: ON TAP -->
  <text x="95" y="38" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#f5e6d3">
    <tspan>ON</tspan>
    <tspan dx="5" fill="#C17F4E">TAP</tspan>
  </text>

  <!-- Text: Coffee -->
  <text x="95" y="68" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#C17F4E">Coffee</text>

  <!-- Tagline dot -->
  <circle cx="183" cy="62" r="3" fill="#762507"/>
</svg>
