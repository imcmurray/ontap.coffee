<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.7;
            color: #e8e0d5;
            background-color: #1a1412;
            font-size: 16px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            background:
                linear-gradient(rgba(26, 20, 18, 0.85), rgba(26, 20, 18, 0.85)),
                url('/images/coffee-header-bg.jpg') center/cover no-repeat;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            padding: 24px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            height: 100px;
            width: auto;
            filter: invert(1) brightness(1.5);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        main {
            min-height: calc(100vh - 200px);
        }

        footer {
            background-color: #762507;
            color: #f5e6d3;
            text-align: center;
            padding: 40px 0;
            margin-top: 80px;
        }

        footer a {
            color: #f5e6d3;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        footer a:hover {
            opacity: 0.8;
        }

        ::selection {
            background-color: #762507;
            color: #fff;
        }
    </style>
    {{ block "head" . }}{{ end }}
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/">
                    <img src="{{ .Site.Params.logo }}" alt="{{ .Site.Title }}" class="logo">
                </a>
            </div>
        </div>
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
            <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.7;">Last built: {{ now.Format "Jan 2, 2006 at 3:04 PM MST" }}</p>
        </div>
    </footer>
</body>
</html>
